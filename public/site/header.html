<header class="header">
  <nav class="nav">
    <div class="logo">
      <img src="imagens/logo.png" alt="Logo" />
    </div>

    <ul class="menu">
      <li><a href="ofertas.html">Ofertas</a></li>
      <li><a href="produtos.html">Produtos</a></li>
      <li><a href="sobrenos.html">Sobre Nós</a></li>
    </ul>

    <div class="search-box">
      <img src="imagens/lupa.png" class="search-icon" />
      <input type="text" id="searchInput" placeholder="O que você procura?" />
    </div>

    <div id="searchResults" class="search-results"></div>

    <div class="nav-icons">
      <div class="user-menu">
        <button class="user-btn" id="btn-user" type="button">
          <img src="imagens/user.png" alt="Usuário" />
          <span id="user-label">Fazer login</span>
        </button>

        <div class="dropdown" id="user-dropdown">
          <a href="#" id="btn-login">Entrar</a>
          <a href="#" id="btn-register">Cadastrar</a>
          <a href="#" id="btn-logout" style="display: none">Sair</a>
          <a href="minha-conta.html" id="btn-account" style="display: none;">Minha conta</a>
          <a href="#" id="btn-logout" style="display: none;">Sair</a>
        </div>
      </div>

      <a class="icon-btn" href="carrinho.html" id="btn-carrinho">
        <img src="imagens/carrinho-de-compras.png" alt="Carrinho" />
        <span class="cart-count">0</span>
      </a>
    </div>
  </nav>

  <div class="modal-overlay" id="modal">
    <div class="modal-box">
      <button class="modal-close" id="closeModal">×</button>

      <div class="modal-content"></div>
    </div>
  </div>

  <template id="login-template">
    <div class="modal-form">
      <div class="login-icon">
        <img src="imagens/user.png" alt="Usuário" />
      </div>

      <h2>Entrar</h2>

      <div class="input-group">
        <img src="imagens/email.png" alt="Email" />
        <input type="email" placeholder="Email" />
      </div>

      <div class="input-group">
        <img src="imagens/senha.png" alt="Senha" />
        <input type="password" placeholder="Senha" />
      </div>

      <button class="btn-primary">Entrar</button>

      <p class="modal-link">
        <a href="#" data-open="forgot-password-template">Esqueci minha senha</a>
      </p>

      <p class="modal-link">
        Não tem uma conta?
        <a href="#" data-open="register-template">Cadastre-se</a>
      </p>
    </div>
  </template>

  <template id="register-template">
    <div class="modal-form">
      <div class="register-icon">
        <img src="imagens\cadastro.png" alt="Cadastro" />
      </div>

      <h2>Cadastrar</h2>

      <input type="text" id="name" placeholder="Nome" required />
      <small class="field-error" id="nameError"></small>

      <input
        type="date"
        id="birthDate"
        placeholder="Data de Nascimento"
        required
      />
      <small class="field-error" id="birthDateError"></small>

      <input type="text" id="cpfCnpj" placeholder="CPF ou CNPJ" required />
      <small class="field-error" id="cpfCnpjError"></small>

      <input type="text" id="phone" placeholder="Telefone" required />
      <small class="field-error" id="phoneError"></small>

      <input type="email" id="registerEmail" placeholder="Email" required />
      <small class="field-error" id="emailError"></small>

      <input type="password" id="password" placeholder="Senha" required />
      <small class="field-error" id="passwordError"></small>

      <h2>Cadastro de endereço</h2>
      <input type="text" id="cep" placeholder="CEP" required />
      <small class="field-error" id="cepError"></small>

      <input type="text" id="rua" placeholder="Rua" required />
      <small class="field-error" id="ruaError"></small>

      <input type="text" id="bairro" placeholder="Bairro" required />
      <small class="field-error" id="bairroError"></small>

      <input type="text" id="cidade" placeholder="Cidade" required />
      <small class="field-error" id="cidadeError"></small>

      <input type="text" id="UF" placeholder="Estado" required />
      <small class="field-error" id="ufError"></small>

      <input type="text" id="complemento" placeholder="Complemento" />

      <button class="btn-primary">Criar conta</button>
    </div>
  </template>

  <template id="forgot-password-template">
    <div class="modal-form">
      <h2>Recuperar senha</h2>

      <p class="modal-text">
        Digite seu e-mail para receber o código de recuperação.
      </p>

      <input type="email" id="recoveryEmail" placeholder="Email" required />
      <small class="field-error" id="recoveryEmailError"></small>

      <button class="btn-primary" id="btnSendRecoveryCode">
        Enviar código
      </button>

      <p class="modal-link">
        Lembrou a senha?
        <a href="#" data-open="login-template">Entrar</a>
      </p>
    </div>
  </template>

  <template id="verify-code-template">
    <div class="modal-form">
      <h2>Digite o código</h2>

      <p class="modal-text">Informe o código enviado para seu e-mail.</p>

      <input type="email" id="verifyEmail" placeholder="Email" required />
      <input
        type="text"
        id="recoveryCode"
        placeholder="Código de recuperação"
        required
      />
      <small class="field-error" id="recoveryCodeError"></small>

      <button class="btn-primary" id="btnVerifyRecoveryCode">
        Verificar código
      </button>
    </div>
  </template>

  <template id="reset-password-template">
    <div class="modal-form">
      <h2>Nova senha</h2>

      <input type="email" id="resetEmail" placeholder="Email" required />
      <input
        type="text"
        id="resetCode"
        placeholder="Código de recuperação"
        required
      />

      <input
        type="password"
        id="newPassword"
        placeholder="Nova senha"
        required
      />
      <small class="field-hint">
        Mínimo 8 caracteres, com letras e números
      </small>
      <small class="field-error" id="newPasswordError"></small>

      <input
        type="password"
        id="confirmNewPassword"
        placeholder="Confirmar nova senha"
        required
      />
      <small class="field-error" id="confirmNewPasswordError"></small>

      <button class="btn-primary" id="btnResetPassword">Redefinir senha</button>
    </div>
  </template>
</header>
