     <div class="search-box">
  <img src="imagens/lupa.png" class="search-icon">
  <input
    type="text"
    id="searchInput"
    placeholder="O que você procura?"
  >
</div>

<div id="searchResults" class="search-results"></div>

      <div class="nav-icons">

        <button class="icon-btn" id="btn-user">
          <img src="imagens/user.png">
        </button>

          <a class="icon-btn" href="carrinho.html" id="btn-carrinho">
          <img src="imagens/carrinho-de-compras.png" alt="Carrinho">

    <div class="modal-overlay" id="modal">
  <div class="modal-box">
    <button class="modal-close" id="closeModal">×</button>

    <div class="modal-content">

    </div>
  </div>
</div>

<template id="login-template">
  <div class="modal-form">

    <div class="login-icon">
      <img src="imagens/user.png" alt="Usuário">
    </div>

    <h2>Entrar</h2>

    <div class="input-group">
      <img src="imagens/email.png" alt="Email">
      <input type="email" placeholder="Email">
    </div>

    <div class="input-group">
      <img src="imagens/senha.png" alt="Senha">
      <input type="password" placeholder="Senha">
    </div>

    <button class="btn-primary">Entrar</button>

    <p class="modal-link">
    Não tem uma conta?
    <a href="#" data-open="register-template">Cadastre-se</a>
    </p>

  </div>
  </template>

<template id="register-template">
  <div class="modal-form">

    <div class="register-icon">
      <img src="imagens\cadastro.png" alt="Cadastro">
        </div>

    <h2>Cadastrar</h2>

    <input type="text" placeholder="Nome" required>
    <input type="date" placeholder="Data de Nascimento" required>
    <input type="text" id="cpfCnpj" placeholder="CPF ou CNPJ">
    <input type="text" placeholder="Telefone" required>
    <input type="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Senha" required>
    <small id="passwordError"></small>

     <h2>Cadastro de endereço</h2>
    <input type="text" id="cep" placeholder="CEP" required>
    <input type="text" id="rua" placeholder="Rua" required>
    <input type="text" id="bairro" placeholder="Bairro" required>
    <input type="text" id="cidade" placeholder="Cidade" required>
    <input type="text" id="UF" placeholder="Estado" required>
    <input type="text" placeholder="Complemento">

    <button class="btn-primary">Criar conta</button>
  </div>
</template>

</header>
