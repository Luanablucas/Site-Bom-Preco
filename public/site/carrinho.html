<link rel="stylesheet" href="style.css" />
<div id="header"></div>

<main class="carrinho-container">
  <h1>Seu carrinho</h1>

  <div id="carrinho-itens"></div>

  <div class="carrinho-resumo">
    <div class="resumo-esquerda">
      <div class="resumo-bloco">
        <label>Forma de entrega</label>

        <div class="tipo-entrega-opcoes">
          <label class="tipo-entrega-card">
            <input type="radio" name="tipoEntrega" value="delivery" checked />
            <span>Entrega</span>
          </label>

          <label class="tipo-entrega-card">
            <input type="radio" name="tipoEntrega" value="pickup" />
            <span>Retirada no mercado</span>
          </label>
        </div>
      </div>
      <div class="resumo-bloco">
        <label for="cepEntrega">Calcular entrega</label>

        <div class="resumo-input">
          <input
            type="text"
            id="cepEntrega"
            placeholder="Digite seu CEP"
            maxlength="9"
          />

          <button type="button" class="btn-outline" id="btnCalcularEntrega">
            Calcular
          </button>
        </div>

        <div class="entrega-card" id="entregaResultado" hidden></div>
      </div>

      <div class="resumo-bloco">
        <label for="cupom">Cupom de desconto</label>

        <div class="resumo-input">
          <input type="text" id="cupom" placeholder="Ex: BOMP10" />

          <button type="button" class="btn-outline" id="btnAplicarCupom">
            Aplicar
          </button>
        </div>

        <small class="resumo-ajuda" id="cupomResultado"></small>
      </div>
    </div>

    <aside class="resumo-direita resumo-card">
      <h2>Resumo do pedido</h2>

      <div class="resumo-linha">
        <span>Subtotal</span>
        <strong id="carrinho-subtotal">R$ 0,00</strong>
      </div>

      <div class="resumo-linha">
        <span>Frete</span>
        <strong id="carrinho-frete">R$ 0,00</strong>
      </div>

      <div class="resumo-divisor"></div>

      <div class="resumo-linha resumo-total">
        <span>Total</span>
        <strong id="carrinho-total">R$ 0,00</strong>
      </div>

      <button type="button" class="btn-finalizar" id="btnFinalizarCompra">
        Finalizar compra
      </button>

      <button type="button" class="btn-limpar" id="btnLimparCarrinho">
        Limpar carrinho
      </button>
    </aside>
  </div>
</main>

<script src="api.js"></script>
<script src="carrinho.js"></script>
<script src="busca.js"></script>
<script src="script.js"></script>
<script src="carrinho-page.js"></script>
